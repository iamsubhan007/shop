name: hbt_app
description: "Haq Bahu Tandoor: order from the restaurant, and run orders, kitchen and deliveries."
publish_to: 'none'

# versionName+versionCode on Android, CFBundleShortVersionString+CFBundleVersion on iOS.
version: 1.1.0+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  provider: ^6.1.5+1
  http: ^1.6.0
  http_parser: ^4.1.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.1
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  audioplayers: ^6.8.1
  wakelock_plus: ^1.8.2
  file_picker: ^13.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/alarm.wav

# Regenerate the app icons with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#B91C1C"
  adaptive_icon_foreground: assets/icon/foreground.png
  remove_alpha_ios: true
  min_sdk_android: 24
